name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18'
  NPM_CACHE: ~/.npm

jobs:
  # ============================================================================
  # STAGE 1: SETUP & LINT
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting
        run: npm run format:check || echo "Format check would fix these issues"
        continue-on-error: true

  # ============================================================================
  # STAGE 2: TYPE CHECKING
  # ============================================================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run TypeScript compiler
        run: npm run typecheck

      - name: Generate TypeScript types from Supabase
        run: npm run db:types || echo "Skipping Supabase type generation"
        continue-on-error: true

  # ============================================================================
  # STAGE 3: BUILD
  # ============================================================================
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build web app
        run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Build packages
        run: npm run build:packages

      - name: Check build artifacts
        run: |
          if [ ! -d "apps/web/.next" ]; then
            echo "ERROR: Web build artifacts not found"
            exit 1
          fi
          echo "✓ Build artifacts verified"

  # ============================================================================
  # STAGE 4: SECURITY CHECKS (PR only)
  # ============================================================================
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Check for common secrets patterns
          if grep -r -i "private\|secret\|password\|token\|key" .env .env.* \
            --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
            echo "ERROR: Potential secrets found in .env files"
            exit 1
          fi

          # Check for hardcoded API keys
          if grep -r "SUPABASE_SERVICE_ROLE\|SUPABASE_DB_PASSWORD\|firebase-adminsdk" \
            apps/ packages/ --exclude-dir=node_modules 2>/dev/null; then
            echo "ERROR: Hardcoded secrets found in source code"
            exit 1
          fi

          echo "✓ No obvious secrets detected"

      - name: Check git history for secrets
        run: |
          # Basic check for .env files being committed
          if git log -p --all -S ".env" -- ".env*" 2>/dev/null | grep -q ".env"; then
            echo "WARNING: .env files may have been committed in history"
          else
            echo "✓ No .env files in git history"
          fi

  # ============================================================================
  # STAGE 5: DEPLOY TO VERCEL (main branch only)
  # ============================================================================
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'northacoustics/northacoustics'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@main
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true
          working-directory: ./apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Comment on PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deploy preview ready: https://vercel.com/northacoustics'
            })

  # ============================================================================
  # STAGE 6: FINAL STATUS CHECK
  # ============================================================================
  status-check:
    name: CI/CD Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, security]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Lint failed"
            exit 1
          fi

          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "❌ Type check failed"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi

          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "❌ Security check failed"
            exit 1
          fi

          echo "✅ All checks passed!"

      - name: Notify Slack (optional)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'NorthAcoustics CI/CD Pipeline Failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

# ============================================================================
# PERMISSIONS & SECURITY
# ============================================================================
permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

# ============================================================================
# CONCURRENCY (Cancel old runs when new push)
# ============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
