version: '3.9'

services:
  # === NORTHACOUSTICS FIELD CLEAN - WEB APPLICATION ===
  north-field-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: north-field-web
    environment:
      # Production mode
      - NODE_ENV=production

      # Expo configuration
      - EXPO_PUBLIC_API_URL=http://north-field-nginx:3111
      - EXPO_PUBLIC_LOCATION_TRACKING=true
      - EXPO_PUBLIC_OFFLINE_MODE=true

      # Application metadata
      - REACT_APP_VERSION=1.0.0
      - REACT_APP_BUILD_DATE=${BUILD_DATE:-2026-05-20}
      - REACT_APP_ENVIRONMENT=production

    ports:
      # 3100: Frontend web application
      - "3100:3100"
      # 19000-19001: Expo development server (for bundler and debugger)
      - "19000:19000"
      - "19001:19001"

    volumes:
      # Code volumes (mounted for hot reload compatibility)
      - ./app:/app/app:ro
      - ./components:/app/components:ro
      - ./constants:/app/constants:ro
      - ./types:/app/types:ro

      # Cache volume (persistent npm cache)
      - north-field-cache:/app/node_modules/.cache

    networks:
      - north-field-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      - north-field-nginx

    # Resource limits (prevent resource exhaustion)
    mem_limit: 1G
    cpus: '1.0'

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === NGINX REVERSE PROXY ===
  north-field-nginx:
    image: nginx:alpine
    container_name: north-field-nginx
    ports:
      # 3111: Reverse proxy for web application
      - "3111:80"

    volumes:
      # NGINX configuration (read-only)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/health.html:/var/www/html/health.html:ro

    networks:
      - north-field-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# === VOLUMES ===
volumes:
  north-field-cache:
    driver: local

# === NETWORKS (ISOLATED) ===
networks:
  north-field-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
